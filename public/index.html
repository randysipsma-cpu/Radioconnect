<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101728"><title>RadioConnect — Testomgeving</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf3ff;background:#0c1220}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#151f32;border-bottom:1px solid #2b3850}header strong{font-size:22px}small,.muted{color:#a5b4cb}.pill{border:1px solid #52617b;border-radius:30px;padding:6px 10px;font-size:12px}main{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{padding:22px;background:#121b2d;border-right:1px solid #2b3850}button{cursor:pointer;border:0;border-radius:10px;background:#263853;color:#f4f7ff;padding:11px 14px;font:inherit}button:focus-visible{outline:2px solid #78aaff}button.active{background:#3658a0}select{width:100%;padding:12px;background:#0e1727;border:1px solid #50607b;border-radius:10px;color:white}nav{display:grid;gap:9px;margin-top:20px}section{padding:30px;max-width:1000px;width:100%;margin:auto}.panel{background:#172238;border:1px solid #2b3850;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{background:#202e47;border-radius:12px;padding:18px}h1{margin-top:0}input{width:100%;padding:12px;background:#0e1727;border:1px solid #50607b;border-radius:10px;color:white}footer{color:#a5b4cb;font-size:13px;margin-top:22px}@media(max-width:650px){main{display:block}aside{border-right:0;border-bottom:1px solid #2b3850;padding:12px}nav{display:flex;overflow-x:auto;margin-top:10px}nav button{white-space:nowrap}section{padding:18px}header{padding:15px}}
</style></head><body><header><strong>📻 RadioConnect</strong><span class="pill" id="authBadge">Ontwikkelpreview</span></header><main><aside><div><b>Demo Radio</b><p class="muted">Voorbeeldstation</p></div><nav id="nav"><button data-page="overview" class="active">Overzicht</button><button data-page="account">Account</button><button data-page="stations">Radiostations</button><button data-page="rooms">Rooms</button><button data-page="manage">Beheer</button><button data-page="files">Bestanden</button><button data-page="radio">Radio</button><button data-page="schedule">DJ-rooster</button><button data-page="settings">Instellingen</button></nav></aside><section><h1 id="heading">Welkom bij RadioConnect</h1><div id="content"></div><footer>Veilige prototype-interface. Chat, accounts, uploads en streambeheer zijn nog niet aangesloten. Geen persoonsgegevens of bestanden invoeren.</footer></section></main><script>
const pages={
overview:['Welkom bij RadioConnect','<p>Een eigen plek voor elk radiostation. Deze preview toont alleen de toekomstige indeling.</p><div class="grid"><div class="tile">💬 Rooms en chat</div><div class="tile">📁 Bestandsopslag</div><div class="tile">🎵 Radioplayer</div><div class="tile">📅 DJ-rooster</div></div>'],
account:['Mijn account','<div class="panel" id="accountPanel"><p>Accountgegevens laden...</p></div>'],
stations:['Radiostations','<div class="panel"><h3>➕ Nieuw radiostation</h3><form id="stationForm"><label for="stationName">Naam radiostation</label><input id="stationName" maxlength="80" required value="Radio Carrousel" autocomplete="off"><p><label for="stationVisibility">Zichtbaarheid</label></p><select id="stationVisibility" disabled><option value="private">Privé (standaard)</option></select><p class="muted">Alleen uitgenodigde leden krijgen toegang. Je wordt eigenaar van je eigen station.</p><button type="submit">Radiostation aanmaken</button></form><p id="stationStatus" role="status" aria-live="polite"></p></div><div class="panel"><h3>Mijn radiostations</h3><div id="stationList" class="muted">Log in om je stations te bekijken.</div></div>'],
rooms:['Privéchat','<div class="panel"><h3>💬 Stationchat</h3><label for="chatStation">Radiostation</label><select id="chatStation"></select><p><label for="chatRoom">Room</label></p><select id="chatRoom"></select><p><button type="button" id="refreshChat">Berichten verversen</button></p><p id="chatStatus" class="muted" role="status"></p><div id="chatMessages" style="display:grid;gap:9px;max-height:50vh;overflow:auto" aria-live="polite"></div><form id="chatForm"><label for="chatText">Nieuw bericht</label><input id="chatText" maxlength="2000" required autocomplete="off" placeholder="Typ een bericht..."><p><button type="submit">Versturen</button></p></form></div>'],
files:['Bestanden','<div class="panel"><h3>📁 Jingles</h3><p class="muted">Nog geen bestanden</p></div><div class="panel"><h3>📁 Commercials</h3><p class="muted">Nog geen bestanden</p></div><div class="panel"><h3>📁 Draaiboeken</h3><p class="muted">Nog geen bestanden</p></div><p>Uploaden wordt pas ingeschakeld nadat beveiligde opslag en autorisatie zijn gebouwd.</p>'],
radio:['Radio','<div class="panel"><h3>📻 Radioplayer</h3><p>De streamspeler wordt in een volgende fase gekoppeld aan de stream-URL van het station.</p></div>'],
schedule:['DJ-rooster','<div class="panel"><h3>Uitzendingen</h3><p>Hier verschijnt straks het rooster met DJ, programma, datum en uitzendtijd.</p></div>'],
manage:['Station beheren','<div class="panel"><h3>📻 Stationsbeheer</h3><p class="muted">Alleen de eigenaar kan de naam aanpassen.</p><label for="manageStation">Radiostation</label><select id="manageStation"></select><p><label for="manageName">Stationsnaam</label><input id="manageName" maxlength="80" required></p><button id="saveStation" type="button">Naam opslaan</button><p id="manageStatus" role="status" aria-live="polite"></p></div>'],
settings:['Instellingen','<div class="panel"><h3>Station en gebruikers</h3><p>Beheerders, rechten, uitnodigingen en opslaglimieten volgen na implementatie van veilige authenticatie.</p></div>']};
let currentUser=null;
let chatTimer=null,chatGeneration=0,chatLastIds=new Set(),chatLoadedRoom='',chatPolling=false,chatSocket=null,chatReconnect=null,chatTypingTimeout=null;
const content=document.getElementById('content');
function el(tag,attrs={},text=''){const node=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));node.textContent=text;return node;}
async function api(path,options={}){const res=await fetch('/api'+path,{credentials:'same-origin',...options});let data;try{data=await res.json()}catch{throw Error('Server geeft geen geldig antwoord');}if(!res.ok)throw Error(data.error||'Aanvraag mislukt');return data;}
function show(page){if(!Object.prototype.hasOwnProperty.call(pages,page))return;stopChatLive();if(chatTimer){clearInterval(chatTimer);chatTimer=null;}chatGeneration++;chatLastIds=new Set();chatLoadedRoom='';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('heading').textContent=pages[page][0];content.innerHTML=pages[page][1];if(page==='account')renderAccount();if(page==='stations')loadStations();if(page==='manage')loadManagement();if(page==='rooms')loadChat();}
async function refreshUser(){try{currentUser=(await api('/me')).user;}catch{currentUser=null;}document.getElementById('authBadge').textContent=currentUser?'Ingelogd: '+currentUser.display_name:'Niet ingelogd';}
function renderAccount(){const panel=document.getElementById('accountPanel');if(!panel)return;panel.replaceChildren();if(currentUser){panel.append(el('p',{},'Ingelogd als '+currentUser.display_name));const out=el('button',{},'Uitloggen');out.addEventListener('click',async()=>{try{await api('/logout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await refreshUser();renderAccount();}catch(err){alert(err.message);}});panel.append(out);return;}
const tabs=el('div',{class:'grid'});const login=el('button',{},'Inloggen'),register=el('button',{},'Registreren');tabs.append(login,register);panel.append(tabs);const form=el('form',{id:'authForm'}),status=el('p',{role:'status'});panel.append(form,status);
function mode(reg){form.replaceChildren();const fields=reg?[['name','Naam','text','name'],['email','E-mailadres','email','email'],['password','Wachtwoord (min. 12 tekens)','password','new-password']]:[['email','E-mailadres','email','email'],['password','Wachtwoord','password','current-password']];for(const [name,label,type,autocomplete] of fields){form.append(el('label',{for:'auth-'+name},label));const input=el('input',{id:'auth-'+name,name,type,autocomplete,required:'required'});if(name==='password'&&reg)input.minLength=12;form.append(input);}const submit=el('button',{type:'submit'},reg?'Account aanmaken':'Inloggen');form.append(submit);const chatInput=document.getElementById('chatText');let lastTyping=0;chatInput.addEventListener('input',()=>{if(chatSocket?.readyState===1&&Date.now()-lastTyping>1200){chatSocket.send(JSON.stringify({type:'typing',active:true}));lastTyping=Date.now();}});form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent='Even wachten...';const body=Object.fromEntries(new FormData(form));try{await api(reg?'/register':'/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(reg){status.textContent='Account aangemaakt. Log nu in.';mode(false);}else{await refreshUser();renderAccount();}}catch(err){status.textContent=err.message;}finally{submit.disabled=false;}};}login.onclick=()=>mode(false);register.onclick=()=>mode(true);mode(false);}
async function loadStations(){const list=document.getElementById('stationList'),form=document.getElementById('stationForm');if(!list||!form)return;const button=form.querySelector('button[type=submit]');button.disabled=!currentUser;if(!currentUser){list.textContent='Log eerst in via Account om een privéstation aan te maken.';return;}list.textContent='Stations laden...';try{const data=await api('/stations');list.replaceChildren();if(!data.stations.length)list.textContent='Je hebt nog geen radiostations.';for(const station of data.stations){const card=el('div',{class:'tile'});card.append(el('strong',{},station.name),el('p',{class:'muted'},'Zichtbaarheid: '+station.visibility+' · Rol: '+station.role));list.append(card);}}catch(err){list.textContent=err.message;}}
async function loadManagement(){const select=document.getElementById('manageStation'),name=document.getElementById('manageName'),status=document.getElementById('manageStatus'),save=document.getElementById('saveStation');if(!select)return;save.disabled=true;if(!currentUser){status.textContent='Log eerst in om je station te beheren.';return;}try{const data=await api('/stations');const owned=data.stations.filter(s=>s.role==='owner');select.replaceChildren();for(const s of owned)select.append(el('option',{value:s.id},s.name));if(!owned.length){status.textContent='Je bent nog geen eigenaar van een radiostation.';return;}const sync=()=>{name.value=owned.find(s=>s.id===select.value)?.name||'';};select.onchange=sync;sync();save.disabled=false;save.onclick=async()=>{save.disabled=true;status.textContent='Wijziging opslaan...';try{const result=await api('/stations/'+encodeURIComponent(select.value),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.value.trim()})});owned.find(s=>s.id===select.value).name=result.name;select.selectedOptions[0].textContent=result.name;status.textContent='Stationsnaam opgeslagen.';}catch(err){status.textContent=err.message;}finally{save.disabled=false;}};}catch(err){status.textContent=err.message;}}
function stopChatLive(){if(chatReconnect){clearTimeout(chatReconnect);chatReconnect=null;}if(chatSocket){const old=chatSocket;chatSocket=null;old.onclose=null;old.onerror=null;old.onmessage=null;old.close();}const presence=document.getElementById('chatPresence');if(presence)presence.remove();}
function startChatLive(roomId,refresh,status){if(!roomId||!document.getElementById('chatMessages'))return;const generation=chatGeneration;const connect=()=>{if(generation!==chatGeneration||document.getElementById('chatRoom')?.value!==roomId)return;const protocol=location.protocol==='https:'?'wss:':'ws:';const socket=new WebSocket(protocol+'//'+location.host+'/api/rooms/'+encodeURIComponent(roomId)+'/live');chatSocket=socket;socket.onopen=()=>{if(chatSocket===socket)status.textContent='🟢 Live verbonden';};socket.onmessage=e=>{if(chatSocket!==socket)return;try{const data=JSON.parse(e.data);if(data.type==='message')refresh(true);if(data.type==='presence'){let p=document.getElementById('chatPresence');if(!p){p=el('p',{id:'chatPresence',class:'muted'});status.parentNode.insertBefore(p,status.nextSibling);}p.textContent='Online: '+(data.users?.join(', ')||'niemand');}if(data.type==='typing'){let t=document.getElementById('chatTyping');if(!t){t=el('p',{id:'chatTyping',class:'muted'});status.parentNode.insertBefore(t,status.nextSibling);}t.textContent=data.active?data.name+' typt...':'';clearTimeout(chatTypingTimeout);chatTypingTimeout=setTimeout(()=>{t.textContent='';},2500);}}catch{}};socket.onclose=()=>{if(chatSocket!==socket)return;chatSocket=null;status.textContent='Verbinding verbroken · opnieuw verbinden...';chatReconnect=setTimeout(connect,3000);};socket.onerror=()=>{socket.close();};};connect();}
async function loadChat(){const station=document.getElementById('chatStation'),room=document.getElementById('chatRoom'),status=document.getElementById('chatStatus'),messages=document.getElementById('chatMessages'),form=document.getElementById('chatForm');if(!station)return;form.querySelector('button').disabled=true;if(!currentUser){status.textContent='Log eerst in via Account.';return;}try{const data=await api('/stations');station.replaceChildren();for(const s of data.stations)station.append(el('option',{value:s.id},s.name));if(!data.stations.length){status.textContent='Maak eerst een radiostation aan.';return;}const loadRooms=async()=>{stopChatLive();if(chatTimer){clearInterval(chatTimer);chatTimer=null;}chatGeneration++;chatLastIds=new Set();chatLoadedRoom='';status.textContent='Rooms laden...';room.replaceChildren();messages.replaceChildren();try{const data=await api('/stations/'+encodeURIComponent(station.value)+'/rooms');for(const r of data.rooms)room.append(el('option',{value:r.id},'# '+r.name));if(!data.rooms.length){status.textContent='Dit station heeft nog geen rooms.';return;}form.querySelector('button').disabled=false;await loadMessages();startChatLive(room.value,loadMessages,status);const generation=chatGeneration;chatTimer=setInterval(()=>{if(generation===chatGeneration&&document.visibilityState==='visible'&&document.getElementById('chatMessages')===messages&&!chatPolling)loadMessages(true);},15000);}catch(err){status.textContent=err.message;}};const loadMessages=async(silent=false)=>{if(!room.value||chatPolling)return;chatPolling=true;const selectedRoom=room.value;const generation=chatGeneration;if(!silent)status.textContent='Berichten laden...';try{const data=await api('/rooms/'+encodeURIComponent(selectedRoom)+'/messages');if(generation!==chatGeneration||selectedRoom!==room.value||document.getElementById('chatMessages')!==messages)return;const sameRoom=chatLoadedRoom===selectedRoom,wasNearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<100,oldIds=sameRoom?chatLastIds:new Set(),newIds=new Set(data.messages.map(m=>m.id));const newCount=sameRoom?data.messages.filter(m=>!oldIds.has(m.id)).length:0;if(!sameRoom||newCount||!silent){messages.replaceChildren();if(!data.messages.length)messages.append(el('p',{class:'muted'},'Nog geen berichten. Start het gesprek!'));for(const m of data.messages){const item=el('div',{class:'tile'});item.append(el('strong',{},m.display_name||'Gebruiker'),el('small',{},' · '+new Date(m.created_at).toLocaleString('nl-NL')),el('p',{},m.body));messages.append(item);}if(!sameRoom||wasNearBottom)messages.scrollTop=messages.scrollHeight;}chatLastIds=newIds;chatLoadedRoom=selectedRoom;const badge=document.getElementById('chatNewBadge');if(badge)badge.remove();if(newCount&&!wasNearBottom){const notice=el('button',{id:'chatNewBadge',type:'button'},'↓ '+newCount+' nieuwe bericht(en)');notice.onclick=()=>{messages.scrollTop=messages.scrollHeight;notice.remove();};messages.parentNode.insertBefore(notice,messages.nextSibling);}status.textContent=data.messages.length+' berichten · automatisch bijwerken (15 sec)'+(newCount?' · '+newCount+' nieuw':'');}catch(err){if(generation===chatGeneration)status.textContent='Chatverbinding: '+err.message;}finally{chatPolling=false;}};station.onchange=loadRooms;room.onchange=()=>{stopChatLive();chatLastIds=new Set();chatLoadedRoom='';loadMessages().then(()=>startChatLive(room.value,loadMessages,status));};document.getElementById('refreshChat').onclick=()=>loadMessages();form.onsubmit=async e=>{e.preventDefault();const input=document.getElementById('chatText'),button=form.querySelector('button'),message=input.value.trim();if(!message)return;button.disabled=true;try{await api('/rooms/'+encodeURIComponent(room.value)+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});input.value='';await loadMessages();}catch(err){status.textContent=err.message;}finally{button.disabled=false;}};await loadRooms();}catch(err){status.textContent=err.message;}}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)show(b.dataset.page)});
content.addEventListener('submit',async e=>{if(e.target.id!=='stationForm')return;e.preventDefault();const name=document.getElementById('stationName').value.trim(),status=document.getElementById('stationStatus'),button=e.target.querySelector('button[type=submit]');if(!currentUser){status.textContent='Log eerst in via Account.';return;}button.disabled=true;status.textContent='Station aanmaken...';try{const data=await api('/stations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});status.textContent=data.name+' is privé aangemaakt.';await loadStations();}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});
show('overview');refreshUser().then(()=>{if(document.querySelector('[data-page="account"].active'))renderAccount();});
</script></body></html>
