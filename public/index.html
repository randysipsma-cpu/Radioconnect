function el(tag,attrs={},text=''){const node=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));node.textContent=text;return node;}
async function api(path,options={}){const res=await fetch('/api'+path,{credentials:'same-origin',...options});let data;try{data=await res.json()}catch{throw Error('Server geeft geen geldig antwoord');}if(!res.ok)throw Error(data.error||'Aanvraag mislukt');return data;}

async function refreshUser(){try{currentUser=(await api('/me')).user;}catch{currentUser=null;}document.getElementById('authBadge').textContent=currentUser?'Ingelogd: '+currentUser.display_name:'Niet ingelogd';}

function mode(reg){form.replaceChildren();const fields=reg?[['name','Naam','text','name'],['email','E-mailadres','email','email'],['password','Wachtwoord (min. 12 tekens)','password','new-password']]:[['email','E-mailadres','email','email'],['password','Wachtwoord','password','current-password']];for(const [name,label,type,autocomplete] of fields){form.append(el('label',{for:'auth-'+name},label));const input=el('input',{id:'auth-'+name,name,type,autocomplete,required:'required'});if(name==='password'&&reg)input.minLength=12;form.append(input);}if(reg){const choice=el('label',{},'Type account');form.append(choice);const type=el('select',{id:'registrationType'});type.append(el('option',{value:'personal'},'DJ / medewerker (via uitnodiging)'),el('option',{value:'station'},'Nieuw radiostation registreren'));form.append(type);const stationField=el('div',{id:'registrationStation'});stationField.append(el('label',{for:'registrationStationName'},'Naam radiostation'));stationField.append(el('input',{id:'registrationStationName',name:'station_name',maxlength:'80',placeholder:'Naam van jouw radiostation'}));stationField.hidden=true;form.append(stationField);type.onchange=()=>{stationField.hidden=type.value!=='station';stationField.querySelector('input').required=type.value==='station';};}const submit=el('button',{type:'submit'},reg?'Account aanmaken':'Inloggen');form.append(submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent='Even wachten...';const body=Object.fromEntries(new FormData(form));try{await api(reg?'/register':'/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(reg){const stationCreated=!!body.station_name;mode(false);status.textContent=stationCreated?'Radiostation aangemaakt. Log nu in om je beheeromgeving te openen.':'Account aangemaakt. Log nu in.';}else{await refreshUser();renderAccount();loadMyInvitations();}}catch(err){status.textContent=err.message;}finally{submit.disabled=false;}};}login.onclick=()=>mode(false);register.onclick=()=>mode(true);mode(false);}
async function loadDjProfile(){const form=document.getElementById('djProfileForm'),status=document.getElementById('djProfileStatus');if(!form)return;form.querySelector('button').disabled=!currentUser;if(!currentUser){status.textContent='Log in om je DJ-profiel te beheren.';return;}try{const data=await api('/profile');for(const [key,value] of Object.entries(data.profile))if(form.elements.namedItem(key))form.elements.namedItem(key).value=value||'';}catch(error){status.textContent=error.message+' (databaseprofielen moeten mogelijk nog worden geactiveerd)';}form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await api('/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});status.textContent='DJ-profiel opgeslagen.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};}
async function loadDirect(){const station=document.getElementById('dmStation'),contact=document.getElementById('dmContact'),messages=document.getElementById('dmMessages'),status=document.getElementById('dmStatus'),form=document.getElementById('dmForm');if(!station)return;if(!currentUser){status.textContent='Log in om privéberichten te bekijken.';return;}let generation=0;const loadMessages=async()=>{const token=++generation;if(!station.value||!contact.value){messages.replaceChildren();return;}try{const data=await api('/stations/'+encodeURIComponent(station.value)+'/direct/'+encodeURIComponent(contact.value));if(token!==generation||!document.getElementById('dmMessages'))return;messages.replaceChildren();for(const m of data.messages){const item=el('div',{class:'tile'},(m.sender_user_id===currentUser.id?'Jij: ':'Ontvanger: ')+m.message);messages.append(item);}if(!data.messages.length)messages.textContent='Nog geen berichten.';status.textContent='Berichten geladen.';}catch(error){status.textContent=error.message;}};const loadContacts=async()=>{contact.replaceChildren();try{const data=await api('/stations/'+encodeURIComponent(station.value)+'/contacts');for(const c of data.contacts)contact.append(el('option',{value:c.user_id},c.display_name+' ('+c.role+')'));await loadMessages();}catch(error){status.textContent=error.message;}};try{const data=await api('/stations');for(const st of data.stations)station.append(el('option',{value:st.id},st.name));if(!data.stations.length){status.textContent='Je bent nog geen lid van een radiostation.';return;}station.onchange=loadContacts;contact.onchange=loadMessages;form.onsubmit=async e=>{e.preventDefault();const input=document.getElementById('dmText'),button=form.querySelector('button');button.disabled=true;try{await api('/stations/'+encodeURIComponent(station.value)+'/direct/'+encodeURIComponent(contact.value),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:input.value})});input.value='';await loadMessages();}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};await loadContacts();}catch(error){status.textContent=error.message;}}
async function loadNotifications(){const list=document.getElementById('notificationList');if(!currentUser){if(list)list.textContent='Log in om meldingen te zien.';return;}try{const data=await api('/notifications');const nav=document.getElementById('notificationNav');if(nav)nav.textContent='Meldingen'+(data.unread?' ('+data.unread+')':'');if(!list)return;list.replaceChildren();for(const n of data.notifications){const tile=el('div',{class:'tile'});tile.append(el('strong',{},(n.read_at?'':'● ')+n.title),el('p',{},n.detail),el('small',{},new Date(n.created_at).toLocaleString('nl-NL')));if(!n.read_at){const button=el('button',{type:'button'},'Markeer gelezen');button.onclick=async()=>{button.disabled=true;try{await api('/notifications/'+encodeURIComponent(n.id)+'/read',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await loadNotifications();}catch(error){button.textContent=error.message;}};tile.append(button);}list.append(tile);}if(!data.notifications.length)list.textContent='Nog geen meldingen.';}catch(error){if(list)list.textContent=error.message;}}
async function loadMyInvitations(){const target=document.getElementById('myInvitations');if(!target)return;if(!currentUser){target.textContent='Log in om uitnodigingen te bekijken.';return;}try{const data=await api('/invitations');target.replaceChildren();if(!data.invitations.length){target.textContent='Geen openstaande uitnodigingen.';return;}const requestedInvite=new URLSearchParams(location.search).get('invite');if(requestedInvite&&data.invitations.some(i=>i.id===requestedInvite)){target.prepend(el('p',{},'Je uitnodiging is gevonden. Klik op Accepteren bij het betreffende station.'));}for(const invite of data.invitations){const tile=el('div',{class:'tile'});tile.append(el('strong',{},invite.name),el('p',{class:'muted'},'Geldig tot '+new Date(invite.expires_at).toLocaleDateString('nl-NL')));const button=el('button',{type:'button'},'Uitnodiging accepteren');button.onclick=async()=>{button.disabled=true;try{await api('/invitations/'+encodeURIComponent(invite.id)+'/accept',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await loadMyInvitations();}catch(error){target.append(el('p',{},error.message));button.disabled=false;}};tile.append(button);target.append(tile);}}catch(error){target.textContent=error.message;}}
async function loadStations(){const list=document.getElementById('stationList'),form=document.getElementById('stationForm');if(!list||!form)return;const button=form.querySelector('button[type=submit]');button.disabled=!currentUser;if(!currentUser){list.textContent='Log eerst in via Account om een privéstation aan te maken.';return;}list.textContent='Stations laden...';try{const data=await api('/stations');list.replaceChildren();if(!data.stations.length)list.textContent='Je hebt nog geen radiostations.';for(const station of data.stations){const card=el('div',{class:'tile'});card.append(el('strong',{},station.name),el('p',{class:'muted'},'Zichtbaarheid: '+station.visibility+' · Rol: '+(station.role==='owner'?'Hoofdbeheerder':station.role)));list.append(card);}}catch(err){list.textContent=err.message;}}
async function loadManagement(){const select=document.getElementById('manageStation'),name=document.getElementById('manageName'),status=document.getElementById('manageStatus'),save=document.getElementById('saveStation');if(!select)return;save.disabled=true;if(!currentUser){status.textContent='Log eerst in om je station te beheren.';return;}try{const data=await api('/stations');const owned=data.stations.filter(s=>s.role==='owner');select.replaceChildren();for(const s of owned)select.append(el('option',{value:s.id},s.name));if(!owned.length){status.textContent='Je bent nog geen eigenaar van een radiostation.';return;}const sync=()=>{name.value=owned.find(s=>s.id===select.value)?.name||'';};select.onchange=sync;sync();save.disabled=false;const inviteButton=document.getElementById('sendInvite'),inviteStatus=document.getElementById('inviteStatus'),inviteList=document.getElementById('inviteList');const listInvites=async()=>{try{const data=await api('/stations/'+encodeURIComponent(select.value)+'/invitations');inviteList.replaceChildren();for(const i of data.invitations)inviteList.append(el('p',{class:'muted'},i.email+' · '+(i.accepted_at?'Geaccepteerd':i.expires_at<Date.now()?'Verlopen':'Uitgenodigd')));if(!data.invitations.length)inviteList.textContent='Nog geen uitnodigingen.';}catch(err){inviteList.textContent=err.message;}};inviteButton.onclick=async()=>{const email=document.getElementById('inviteEmail').value.trim();inviteButton.disabled=true;try{const result=await api('/stations/'+encodeURIComponent(select.value)+'/invitations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})});inviteStatus.replaceChildren();inviteStatus.append(el('span',{},'Uitnodiging aangemaakt. Deel de link met de ontvanger (alleen het uitgenodigde e-mailadres kan accepteren). '));const share=el('button',{type:'button'},'Kopieer uitnodigingslink');share.onclick=async()=>{try{await navigator.clipboard.writeText(result.invite_url);share.textContent='Link gekopieerd';}catch{prompt('Kopieer de uitnodigingslink',result.invite_url);}};inviteStatus.append(share);const mail=el('a',{href:'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Uitnodiging RadioConnect')+'&body='+encodeURIComponent('Je bent uitgenodigd voor RadioConnect. Open: '+result.invite_url)},' Open e-mail');inviteStatus.append(mail);document.getElementById('inviteEmail').value='';await listInvites();}catch(err){inviteStatus.textContent=err.message;}finally{inviteButton.disabled=false;}};select.addEventListener('change',listInvites);await listInvites();const memberList=document.getElementById('memberList');const listMembers=async()=>{if(!memberList)return;memberList.textContent='Leden laden...';try{const result=await api('/stations/'+encodeURIComponent(select.value)+'/members');memberList.replaceChildren();for(const member of result.members){const row=el('div',{class:'tile'});row.append(el('strong',{},member.display_name),el('p',{class:'muted'},'Huidige rol: '+({owner:'Hoofdbeheerder',admin:'Admin',dj:'DJ',member:'Lid'}[member.role]||member.role)));if(member.role!=='owner'&&member.user_id!==currentUser?.id){const chooser=el('select');for(const [value,label] of [['member','Lid'],['dj','DJ'],['admin','Admin']]){if(result.your_role!=='owner'&&value==='admin')continue;chooser.append(el('option',{value},label));}chooser.value=member.role;const update=el('button',{type:'button'},'Rol opslaan');update.onclick=async()=>{update.disabled=true;try{await api('/stations/'+encodeURIComponent(select.value)+'/members/'+encodeURIComponent(member.user_id)+'/role',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({role:chooser.value})});await listMembers();}catch(error){alert(error.message);update.disabled=false;}};row.append(chooser,update);const remove=el('button',{type:'button'},'Lid verwijderen');remove.onclick=async()=>{if(!confirm('Dit lid de toegang tot dit station ontnemen?'))return;remove.disabled=true;try{await api('/stations/'+encodeURIComponent(select.value)+'/members/'+encodeURIComponent(member.user_id)+'/remove',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await listMembers();}catch(error){alert(error.message);remove.disabled=false;}};row.append(remove);}memberList.append(row);}if(!result.members.length)memberList.textContent='Geen leden.';}catch(error){memberList.textContent=error.message;}};select.addEventListener('change',listMembers);await listMembers();const auditList=document.getElementById('auditList');const loadAudit=async()=>{if(!auditList)return;auditList.textContent='Logboek laden...';try{const data=await api('/stations/'+encodeURIComponent(select.value)+'/audit');auditList.replaceChildren();for(const event of data.events){const labels={'station.rename':'Stationsnaam gewijzigd','member.role_change':'Ledenrol gewijzigd','member.remove':'Lid verwijderd','invitation.create':'Uitnodiging aangemaakt'};auditList.append(el('p',{class:'muted'},new Date(event.created_at).toLocaleString('nl-NL')+' · '+event.actor_name+' · '+(labels[event.action]||event.action)));}if(!data.events.length)auditList.textContent='Nog geen gebeurtenissen.';}catch(error){auditList.textContent=error.message;}};select.addEventListener('change',loadAudit);await loadAudit();save.onclick=async()=>{save.disabled=true;status.textContent='Wijziging opslaan...';try{const result=await api('/stations/'+encodeURIComponent(select.value),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.value.trim()})});owned.find(s=>s.id===select.value).name=result.name;select.selectedOptions[0].textContent=result.name;status.textContent='Stationsnaam opgeslagen.';}catch(err){status.textContent=err.message;}finally{save.disabled=false;}};}catch(err){status.textContent=err.message;}}
function stopChatLive(){if(chatReconnect){clearTimeout(chatReconnect);chatReconnect=null;}if(chatSocket){const old=chatSocket;chatSocket=null;old.onclose=null;old.onerror=null;old.onmessage=null;old.close();}const presence=document.getElementById('chatPresence');if(presence)presence.remove();}
function startChatLive(roomId,refresh,status){if(!roomId||!document.getElementById('chatMessages'))return;const connection=document.getElementById('chatConnection');const generation=chatGeneration;const connect=()=>{if(generation!==chatGeneration||document.getElementById('chatRoom')?.value!==roomId)return;const protocol=location.protocol==='https:'?'wss:':'ws:';if(connection)connection.textContent='🟡 Realtime verbinding maken...';const socket=new WebSocket(protocol+'//'+location.host+'/api/rooms/'+encodeURIComponent(roomId)+'/live');chatSocket=socket;socket.onopen=()=>{if(chatSocket===socket&&connection)connection.textContent='🟢 Live verbonden · berichten verschijnen direct';};socket.onmessage=e=>{if(chatSocket!==socket)return;try{const data=JSON.parse(e.data);if(data.type==='message'||data.type==='message_updated')refresh(true);if(data.type==='presence'){let p=document.getElementById('chatPresence');if(!p){p=el('p',{id:'chatPresence',class:'muted'});status.parentNode.insertBefore(p,status.nextSibling);}p.textContent='Online: '+(data.users?.join(', ')||'niemand');}if(data.type==='typing'){let t=document.getElementById('chatTyping');if(!t){t=el('p',{id:'chatTyping',class:'muted'});status.parentNode.insertBefore(t,status.nextSibling);}t.textContent=data.active?data.name+' typt...':'';clearTimeout(chatTypingTimeout);chatTypingTimeout=setTimeout(()=>{t.textContent='';},2500);}}catch{}};socket.onclose=async()=>{if(chatSocket!==socket)return;chatSocket=null;if(connection)connection.textContent='🔴 Realtime niet verbonden · verbinding controleren...';try{const check=await api('/rooms/'+encodeURIComponent(roomId)+'/live-check');if(connection&&generation===chatGeneration)connection.textContent=check.status==='ok'?'🔴 Liveverbinding onderbroken · opnieuw verbinden...':'🔴 '+(check.error||'Realtime niet beschikbaar');}catch(error){if(connection&&generation===chatGeneration)connection.textContent='🔴 '+error.message;}if(generation===chatGeneration)chatReconnect=setTimeout(connect,5000);};socket.onerror=()=>{socket.close();};};connect();}
async function loadChat(){const station=document.getElementById('chatStation'),room=document.getElementById('chatRoom'),status=document.getElementById('chatStatus'),messages=document.getElementById('chatMessages'),form=document.getElementById('chatForm');if(!station)return;form.querySelector('button').disabled=true;if(!currentUser){status.textContent='Log eerst in via Account.';return;}try{const data=await api('/stations');station.replaceChildren();for(const s of data.stations)station.append(el('option',{value:s.id},s.name));if(!data.stations.length){status.textContent='Maak eerst een radiostation aan.';return;}const loadRooms=async()=>{stopChatLive();if(chatTimer){clearInterval(chatTimer);chatTimer=null;}chatGeneration++;chatLastIds=new Set();chatLoadedRoom='';status.textContent='Rooms laden...';room.replaceChildren();messages.replaceChildren();try{const data=await api('/stations/'+encodeURIComponent(station.value)+'/rooms');for(const r of data.rooms)room.append(el('option',{value:r.id},'# '+r.name));if(!data.rooms.length){status.textContent='Dit station heeft nog geen rooms.';return;}form.querySelector('button').disabled=false;await loadMessages();startChatLive(room.value,loadMessages,status);const generation=chatGeneration;chatTimer=setInterval(()=>{if(generation===chatGeneration&&document.visibilityState==='visible'&&document.getElementById('chatMessages')===messages&&!chatPolling)loadMessages(true);},15000);}catch(err){status.textContent=err.message;}};const loadMessages=async(silent=false)=>{if(!room.value||chatPolling)return;chatPolling=true;const selectedRoom=room.value;const generation=chatGeneration;if(!silent)status.textContent='Berichten laden...';try{const data=await api('/rooms/'+encodeURIComponent(selectedRoom)+'/messages');if(generation!==chatGeneration||selectedRoom!==room.value||document.getElementById('chatMessages')!==messages)return;const sameRoom=chatLoadedRoom===selectedRoom,wasNearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<100,oldIds=sameRoom?chatLastIds:new Set(),newIds=new Set(data.messages.map(m=>m.id));const newCount=sameRoom?data.messages.filter(m=>!oldIds.has(m.id)).length:0;if(!sameRoom||newCount||!silent){messages.replaceChildren();if(!data.messages.length)messages.append(el('p',{class:'muted'},'Nog geen berichten. Start het gesprek!'));for(const m of data.messages){const item=el('div',{class:'tile'});item.append(el('strong',{},(m.pinned?'📌 ':'')+(m.display_name||'Gebruiker')),el('small',{},' · '+new Date(m.created_at).toLocaleString('nl-NL')),el('p',{},m.body));const controls=el('div',{style:'display:flex;gap:5px;flex-wrap:wrap'});for(const emoji of ['👍','❤️','😂','👏','🔥']){const count=m.reactions?.find(r=>r.emoji===emoji)?.count||0;const btn=el('button',{type:'button',title:'Reageer met '+emoji},emoji+(count?' '+count:''));btn.onclick=async()=>{btn.disabled=true;try{await api('/rooms/'+encodeURIComponent(selectedRoom)+'/messages/'+encodeURIComponent(m.id)+'/react',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({emoji})});await loadMessages();}catch(error){status.textContent=error.message;}finally{btn.disabled=false;}};controls.append(btn);}if(data.can_pin){const pin=el('button',{type:'button'},m.pinned?'Losmaken':'📌 Vastzetten');pin.onclick=async()=>{pin.disabled=true;try{await api('/rooms/'+encodeURIComponent(selectedRoom)+'/messages/'+encodeURIComponent(m.id)+'/pin',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});await loadMessages();}catch(error){status.textContent=error.message;}finally{pin.disabled=false;}};controls.append(pin);}item.append(controls);messages.append(item);}if(!sameRoom||wasNearBottom)messages.scrollTop=messages.scrollHeight;}chatLastIds=newIds;chatLoadedRoom=selectedRoom;const badge=document.getElementById('chatNewBadge');if(badge)badge.remove();if(newCount&&!wasNearBottom){const notice=el('button',{id:'chatNewBadge',type:'button'},'↓ '+newCount+' nieuwe bericht(en)');notice.onclick=()=>{messages.scrollTop=messages.scrollHeight;notice.remove();};messages.parentNode.insertBefore(notice,messages.nextSibling);}status.textContent=data.messages.length+' berichten'+(newCount?' · '+newCount+' nieuw':'');}catch(err){if(generation===chatGeneration)status.textContent='Chatverbinding: '+err.message;}finally{chatPolling=false;}};station.onchange=loadRooms;room.onchange=()=>{stopChatLive();chatLastIds=new Set();chatLoadedRoom='';loadMessages().then(()=>startChatLive(room.value,loadMessages,status));};document.getElementById('chatEmoji')?.addEventListener('click',e=>{const emoji=e.target.closest('button[data-emoji]')?.dataset.emoji;if(emoji){const input=document.getElementById('chatText');input.value+=emoji;input.focus();}});form.onsubmit=async e=>{e.preventDefault();const input=document.getElementById('chatText'),button=form.querySelector('button'),message=input.value.trim();if(!message)return;button.disabled=true;try{await api('/rooms/'+encodeURIComponent(room.value)+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});input.value='';await loadMessages();}catch(err){status.textContent=err.message;}finally{button.disabled=false;}};await loadRooms();}catch(err){status.textContent=err.message;}}
