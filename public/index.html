<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101728"><title>RadioConnect — Testomgeving</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf3ff;background:#0c1220}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#151f32;border-bottom:1px solid #2b3850}header strong{font-size:22px}small,.muted{color:#a5b4cb}.pill{border:1px solid #52617b;border-radius:30px;padding:6px 10px;font-size:12px}main{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{padding:22px;background:#121b2d;border-right:1px solid #2b3850}button{cursor:pointer;border:0;border-radius:10px;background:#263853;color:#f4f7ff;padding:11px 14px;font:inherit}button:focus-visible{outline:2px solid #78aaff}button.active{background:#3658a0}select{width:100%;padding:12px;background:#0e1727;border:1px solid #50607b;border-radius:10px;color:white}nav{display:grid;gap:9px;margin-top:20px}section{padding:30px;max-width:1000px;width:100%;margin:auto}.panel{background:#172238;border:1px solid #2b3850;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{background:#202e47;border-radius:12px;padding:18px}h1{margin-top:0}input{width:100%;padding:12px;background:#0e1727;border:1px solid #50607b;border-radius:10px;color:white}footer{color:#a5b4cb;font-size:13px;margin-top:22px}@media(max-width:650px){main{display:block}aside{border-right:0;border-bottom:1px solid #2b3850;padding:12px}nav{display:flex;overflow-x:auto;margin-top:10px}nav button{white-space:nowrap}section{padding:18px}header{padding:15px}}
</style></head><body><header><strong>📻 RadioConnect</strong><span class="pill">Ontwikkelpreview · geen live gegevens</span></header><main><aside><div><b>Demo Radio</b><p class="muted">Voorbeeldstation</p></div><nav id="nav"><button data-page="overview" class="active">Overzicht</button><button data-page="stations">Radiostations</button><button data-page="rooms">Rooms</button><button data-page="files">Bestanden</button><button data-page="radio">Radio</button><button data-page="schedule">DJ-rooster</button><button data-page="settings">Instellingen</button></nav></aside><section><h1 id="heading">Welkom bij RadioConnect</h1><div id="content"></div><footer>Veilige prototype-interface. Chat, accounts, uploads en streambeheer zijn nog niet aangesloten. Geen persoonsgegevens of bestanden invoeren.</footer></section></main><script>
const pages={
overview:['Welkom bij RadioConnect','<p>Een eigen plek voor elk radiostation. Deze preview toont alleen de toekomstige indeling.</p><div class="grid"><div class="tile">💬 Rooms en chat</div><div class="tile">📁 Bestandsopslag</div><div class="tile">🎵 Radioplayer</div><div class="tile">📅 DJ-rooster</div></div>'],
stations:['Radiostations','<div class="panel"><h3>➕ Nieuw radiostation</h3><form id="stationForm"><label for="stationName">Naam radiostation</label><input id="stationName" maxlength="80" required value="Radio Carrousel" autocomplete="off"><p><label for="stationVisibility">Zichtbaarheid</label></p><select id="stationVisibility" disabled><option value="private">Privé (standaard)</option></select><p class="muted">Alleen uitgenodigde leden krijgen toegang. Je wordt eigenaar van je eigen station.</p><button type="submit">Radiostation aanmaken</button></form><p id="stationStatus" role="status" aria-live="polite"></p></div><div class="panel"><h3>Mijn radiostations</h3><p class="muted">Er zijn nog geen opgeslagen stations. Accounts en database worden later aangesloten.</p></div>'],
rooms:['Rooms','<div class="panel"><h3># algemeen</h3><p class="muted">Voorbeeldroom · chat nog niet actief</p></div><div class="panel"><h3># dj-overleg</h3><p class="muted">Voorbeeldroom · chat nog niet actief</p></div><div class="panel"><h3>🔒 management</h3><p class="muted">Alleen voor bevoegde gebruikers in een toekomstige versie</p></div>'],
files:['Bestanden','<div class="panel"><h3>📁 Jingles</h3><p class="muted">Nog geen bestanden</p></div><div class="panel"><h3>📁 Commercials</h3><p class="muted">Nog geen bestanden</p></div><div class="panel"><h3>📁 Draaiboeken</h3><p class="muted">Nog geen bestanden</p></div><p>Uploaden wordt pas ingeschakeld nadat beveiligde opslag en autorisatie zijn gebouwd.</p>'],
radio:['Radio','<div class="panel"><h3>📻 Radioplayer</h3><p>De streamspeler wordt in een volgende fase gekoppeld aan de stream-URL van het station.</p></div>'],
schedule:['DJ-rooster','<div class="panel"><h3>Uitzendingen</h3><p>Hier verschijnt straks het rooster met DJ, programma, datum en uitzendtijd.</p></div>'],
settings:['Instellingen','<div class="panel"><h3>Station en gebruikers</h3><p>Beheerders, rechten, uitnodigingen en opslaglimieten volgen na implementatie van veilige authenticatie.</p></div>']};
function show(page){if(!Object.prototype.hasOwnProperty.call(pages,page))return;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('heading').textContent=pages[page][0];document.getElementById('content').innerHTML=pages[page][1];}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)show(b.dataset.page)});
document.getElementById('content').addEventListener('submit',e=>{if(e.target.id!=='stationForm')return;e.preventDefault();const name=document.getElementById('stationName').value.trim();document.getElementById('stationStatus').textContent=name?'Dit is een veilige voorbeeldweergave. '+name+' is nog niet opgeslagen: eerst moet beveiligd inloggen en de database worden aangesloten.':'Vul een stationsnaam in.';});
show('overview');
</script></body></html>
